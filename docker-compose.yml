# LITIGATION MONITOR — sobe API, painel e n8n com:  docker compose up -d --build
#   Painel:  http://localhost:8501
#   API:     http://localhost:8000/docs
#   n8n:     http://localhost:5678

x-lm-env: &lm-env
  LM_DADOS: /dados
  TZ: America/Sao_Paulo
  LM_FONTE: ${LM_FONTE:-demo}
  DATAJUD_API_KEY: ${DATAJUD_API_KEY:-}
  GMAIL_USUARIO: ${GMAIL_USUARIO:-}
  EMAIL_ALERTAS: ${EMAIL_ALERTAS:-}
  LM_URL_PAINEL: ${LM_URL_PAINEL:-http://localhost:8501}
  LM_URL_API: ${LM_URL_API:-http://localhost:8000}
  LM_PLANILHA: ${LM_PLANILHA:-}
  LM_DIAS_ALERTA: ${LM_DIAS_ALERTA:-3}
  LM_HORAS_REPETICAO_VENCIDO: ${LM_HORAS_REPETICAO_VENCIDO:-24}
  LM_RELEVANCIA_ALERTA: ${LM_RELEVANCIA_ALERTA:-Média}
  LM_DIAS_RETROATIVOS: ${LM_DIAS_RETROATIVOS:-15}

services:
  api:
    build: .
    command: uvicorn litmonitor.api:app --host 0.0.0.0 --port 8000
    environment: *lm-env
    volumes:
      - dados:/dados
      - ./planilhas:/planilhas:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  painel:
    build: .
    command: streamlit run painel/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment: *lm-env
    volumes:
      - dados:/dados
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Cria a credencial do Gmail, importa (ou atualiza) os workflows de n8n/workflows e os ativa; depois encerra.
  n8n-importar:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSAO:-1.123.93}
    entrypoint: ["/bin/sh", "/importar.sh"]
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      GMAIL_USUARIO: ${GMAIL_USUARIO:-}
      GMAIL_SENHA_APP: ${GMAIL_SENHA_APP:-}
    volumes:
      - n8n_dados:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/importar.sh:/importar.sh:ro
    restart: "no"

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSAO:-1.123.93}
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      WEBHOOK_URL: http://localhost:5678/
    volumes:
      - n8n_dados:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      n8n-importar:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dados:
  n8n_dados:
